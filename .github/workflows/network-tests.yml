name: network-tests

# Reads live data from Redivis, so it needs the REDIVIS_API_TOKEN secret.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}
      PEEKBANK_NETWORK_TESTS: "true"
      LIBARROW_BINARY: "true"
    steps:
      - uses: actions/checkout@v4

      # without a token the redivis client falls back to interactive auth and
      # blocks until the job times out, so stop early with a useful message
      - name: Check the token is available
        run: |
          if [ -z "$REDIVIS_API_TOKEN" ]; then
            echo "REDIVIS_API_TOKEN is not set. Add it under" \
                 "Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://langcog.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, local::.

      - name: Run tests
        run: testthat::test_local()
        shell: Rscript {0}
