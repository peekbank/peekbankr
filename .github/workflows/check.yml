name: R-CMD-check

on:
  push:
    branches: [master, main, redivis]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    name: check (NOT_CRAN, offline tests)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LIBARROW_BINARY: "true"
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          extra-repositories: https://langcog.r-universe.dev
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'

  cran-simulation:
    runs-on: ubuntu-latest
    name: check (CRAN simulation)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LIBARROW_BINARY: "true"
      # r-lib's check action sets NOT_CRAN=true by default, which re-enables
      # the network-gated vignette; force the CRAN condition instead
      NOT_CRAN: "false"
      _R_CHECK_FORCE_SUGGESTS_: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          extra-repositories: https://langcog.r-universe.dev
      - uses: r-lib/actions/check-r-package@v2
        env:
          NOT_CRAN: "false"
        with:
          args: 'c("--no-manual", "--as-cran")'
